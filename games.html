<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games — Landon's Day</title>
    <link rel="stylesheet" href="./assets/css/styles.css">
    <link rel="stylesheet" href="./assets/css/wii.css">
    <link rel="stylesheet" href="./assets/css/wii-channels.css">
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Games — Landon's Day">
    <meta property="og:description" content="Live Marvel Rivals stats, my Steam library, Hypixel stats, and a 360° look at our Minecraft Realm.">
    <meta property="og:url" content="https://www.landonday.com/games">
    <meta property="og:image" content="https://www.landonday.com/assets/images/games.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Games — Landon's Day">
    <meta name="twitter:description" content="Live Marvel Rivals stats, my Steam library, Hypixel stats, and a 360° look at our Minecraft Realm.">
    <meta name="twitter:image" content="https://www.landonday.com/assets/images/games.png">

</head>
<body class="games-page wii">

    <!-- Health & safety screen (once per visit) -->
    <div class="hs" id="hs" hidden role="dialog" aria-label="Health and safety notice">
        <h1 class="hs-title"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 21h20z" fill="none" stroke="#111" stroke-width="2.2" stroke-linejoin="round"/><path d="M12 10v5" stroke="#111" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="18" r="1.3" fill="#111"/></svg> WARNING-HEALTH AND SAFETY</h1>
        <p id="hsLine1">BEFORE BROWSING, BE AWARE THAT LANDON HAS PLAYED A LOT OF VIDEO GAMES.</p>
        <p>PLEASE TAKE A BREAK EVERY SO OFTEN. STRETCH. DRINK SOME WATER. PET A CAT IF ONE IS NEARBY.</p>
        <div class="hs-press">Press <span class="a-btn">A</span> to continue.</div>
    </div>

    <!-- Channel menu -->
    <main class="menu" id="menu">
        <div class="grid-wrap">
            <div class="grid" id="grid"></div>
        </div>
        <div class="bar">
            <div class="bar-body"></div>
            <div class="cradle left"></div>
            <div class="cradle right"></div>
            <a class="round-btn left" href="index" aria-label="Back to Landon's Day"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z" fill="currentColor"/></svg><span>Home</span></a>
            <div class="clock" aria-live="off">
                <div class="clock-time" id="clockTime">12<span class="colon">:</span>00<small>PM</small></div>
                <div class="clock-date" id="clockDate">Mon 1/1</div>
            </div>
            <button class="round-btn right" id="boardBtn" aria-label="Open the message board"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v12H3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="m3 7 9 6 9-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span class="dot"></span></button>
        </div>
    </main>

    <!-- Channel preview -->
    <div class="preview" id="preview" hidden role="dialog" aria-label="Channel preview">
        <div class="banner" id="banner"></div>
        <div class="preview-buttons">
            <button class="pill" id="backToMenu">Menu</button>
            <button class="pill" id="startChannel">Start</button>
        </div>
    </div>

    <!-- Channels (filled in by games-channels.js on first open) -->
    <section class="channel-screen" id="ch-rivals" data-theme="rivals" hidden aria-label="Marvel Rivals channel"></section>
    <section class="channel-screen" id="ch-steam" data-theme="steam" hidden aria-label="Steam channel"></section>
    <section class="channel-screen" id="ch-hypixel" data-theme="hypixel" hidden aria-label="Hypixel channel"></section>
    <section class="channel-screen" id="ch-realm" data-theme="realm" hidden aria-label="Our Realm channel"></section>
    <section class="channel-screen" id="ch-overwatch" data-theme="overwatch" hidden aria-label="Overwatch channel"></section>

    <button class="home-btn" id="homeBtn" hidden aria-label="Open the HOME Menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z" fill="currentColor"/></svg><span>HOME</span></button>

    <!-- HOME Menu -->
    <div class="home-menu" id="homeMenu" hidden role="dialog" aria-label="HOME Menu">
        <div class="hm-top">
            <span class="hm-title">HOME Menu</span>
            <button class="hm-close" id="hmClose">✕ Close</button>
        </div>
        <div class="hm-middle">
            <button class="hm-big" id="hmChannels">Channels</button>
            <a class="hm-big" href="index" style="display:flex;align-items:center;justify-content:center;text-decoration:none;">Landon's Day</a>
        </div>
        <div class="hm-bottom">
            <div class="remote"><span class="p">P1</span><span class="batt"><i></i><i></i><i></i><i></i></span></div>
        </div>
    </div>

    <!-- Message Board -->
    <div class="board" id="board" hidden role="dialog" aria-label="Message board">
        <div class="board-head">
            <div class="board-date"><b id="boardDay">1</b><span id="boardMonth">January</span></div>
            <button class="pill" id="boardBack" style="min-width:160px;">Back</button>
        </div>
        <div class="board-list" id="boardList"></div>
    </div>

    <div class="fader" id="fader"></div>

    <script src="https://cdn.jsdelivr.net/npm/skinview3d@3.4.1/bundles/skinview3d.bundle.js"></script>
    <script src="./assets/js/games-data.js"></script>
    <script src="./assets/js/games-channels.js"></script>
    <script src="./assets/js/wii-menu.js"></script>
</body>
</html>
