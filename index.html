<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landon's Day</title>
    <link rel="stylesheet" href="./assets/css/desktop.css">
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Landon's Day">
    <meta property="og:description" content="a website to look into the day of landon day: marvel, movies, shows, rosie, and more">
    <meta property="og:url" content="https://www.landonday.com/">
    <meta property="og:image" content="https://www.landonday.com/assets/images/rosiecard.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Landon's Day">
    <meta name="twitter:description" content="a website to look into the day of landon day: marvel, movies, shows, rosie, and more">
    <meta name="twitter:image" content="https://www.landonday.com/assets/images/rosiecard.jpg">
</head>
<body>

    <div class="boot" id="boot" hidden>
        <div id="bootLogo"></div>
        <div class="boot-title">Landon's Day<sup>98</sup></div>
        <div class="boot-bar"></div>
        <div class="boot-note">Starting up… (click to skip)</div>
    </div>

    <main class="desktop" id="desktop">
        <div class="desktop-logo" id="desktopLogo">
            <div class="wordmark">Landon's Day<sup>98</sup></div>
            <div class="tagline">marvel · movies · rosie · games · wrestling</div>
        </div>
        <div class="icons" id="icons"></div>
        <div class="widgets" id="widgets"></div>
        <div id="windows"></div>
        <div class="pet" id="pet" role="button" tabindex="0" aria-label="Rosie the cat"></div>
        <div class="pet-bubble" id="petBubble" hidden></div>
    </main>

    <!-- The Start menu holds real links to every page, so the site is
         still navigable (and crawlable) even before any window opens. -->
    <nav class="menu start-menu" id="startMenu" hidden aria-label="Start menu">
        <div class="start-banner"><span>Landon's Day <b>98</b></span></div>
        <div class="menu-items">
            <a class="menu-item" href="marvel" data-icon="marvel">Marvel</a>
            <a class="menu-item" href="movies" data-icon="movies">Movies &amp; Shows</a>
            <a class="menu-item" href="rosie" data-icon="rosie">Rosie</a>
            <a class="menu-item" href="games" data-icon="games">Games</a>
            <a class="menu-item" href="wrestling" data-icon="wrestling">Wrestling</a>
            <a class="menu-item" href="life" data-icon="life">Life</a>
            <div class="sep"></div>
            <button class="menu-item" data-open="photos" data-icon="photos">My Photos</button>
            <button class="menu-item" data-open="about" data-icon="notepad">About Me</button>
            <button class="menu-item" data-open="display" data-icon="display">Wallpaper…</button>
            <div class="sep"></div>
            <button class="menu-item" id="shutDownBtn" data-icon="power">Shut Down…</button>
        </div>
    </nav>

    <div class="menu context-menu" id="contextMenu" hidden>
        <div class="menu-items">
            <button class="menu-item" id="refreshBtn">Refresh</button>
            <div class="sep"></div>
            <button class="menu-item" data-open="display">Wallpaper…</button>
            <button class="menu-item" data-open="computer">Properties</button>
        </div>
    </div>

    <footer class="taskbar">
        <button class="btn start-btn" id="startBtn" aria-haspopup="true" aria-controls="startMenu"><span id="startLogo"></span>Start</button>
        <div class="task-buttons" id="taskButtons"></div>
        <div class="tray">
            <span id="trayPaw" title="Rosie's Scratchboard"></span>
            <span id="clock"></span>
        </div>
    </footer>

    <div class="shutdown" id="shutdown" hidden>
        It's now safe to turn off your computer.
        <small>(click anywhere to start back up)</small>
    </div>

    <noscript>
        <p style="background:#fff;padding:1rem;position:fixed;inset:0;z-index:1000000;">
            Landon's Day: <a href="marvel">Marvel</a> · <a href="movies">Movies</a> · <a href="rosie">Rosie</a> ·
            <a href="games">Games</a> · <a href="wrestling">Wrestling</a> · <a href="life">Life</a>
        </p>
    </noscript>

    <script>
        // ================================================================
        // Icons — small hand-drawn SVGs in the chunky 98 style.
        // ================================================================
        const SVG = (body, box = 32) =>
            `<svg viewBox="0 0 ${box} ${box}" shape-rendering="crispEdges" aria-hidden="true">${body}</svg>`;

        const ICONS = {
            computer: SVG(`<rect x="4" y="3" width="24" height="18" fill="#c0c0c0" stroke="#000"/><rect x="7" y="6" width="18" height="12" fill="#008080"/><rect x="12" y="21" width="8" height="3" fill="#808080"/><rect x="5" y="24" width="22" height="5" fill="#c0c0c0" stroke="#000"/><rect x="20" y="26" width="4" height="1" fill="#0a0"/>`),
            marvel: SVG(`<rect x="6" y="3" width="20" height="26" fill="#e0261d" stroke="#000"/><rect x="8" y="5" width="16" height="5" fill="#fff"/><rect x="10" y="7" width="12" height="1" fill="#e0261d"/><path d="M16 12l2.2 4.2 4.6.6-3.4 3.2.9 4.6L16 22.4l-4.3 2.2.9-4.6-3.4-3.2 4.6-.6z" fill="#ffd83a" stroke="#000" shape-rendering="auto"/>`),
            movies: SVG(`<rect x="4" y="12" width="24" height="16" fill="#222" stroke="#000"/><path d="M4 7L27 3.5 28 9 5 12.5z" fill="#fff" stroke="#000" shape-rendering="auto"/><path d="M9 6.3l3 5M15 5.4l3 5M21 4.5l3 5" stroke="#000" stroke-width="2.5" shape-rendering="auto"/><rect x="7" y="16" width="12" height="2" fill="#ccc"/><rect x="7" y="21" width="16" height="2" fill="#ccc"/>`),
            rosie: SVG(`<path d="M5 5l6 6h10l6-6v15c0 6-5 8-11 8S5 26 5 20z" fill="#fbf8f2"/><path d="M5 5l6 6-1 7-5-1z" fill="#e08a3c"/><path d="M27 5l-6 6 1 5 5 2z" fill="#2a2522"/><path d="M5 5l6 6h10l6-6v15c0 6-5 8-11 8S5 26 5 20z" fill="none" stroke="#000" shape-rendering="auto"/><rect x="10" y="16" width="3" height="3" fill="#111"/><rect x="19" y="16" width="3" height="3" fill="#111"/><path d="M14.5 21h3L16 23z" fill="#e9a0a0" shape-rendering="auto"/>`),
            games: SVG(`<path d="M7 11h18c3 0 5 2 5 6v4c0 3-2 5-4 5-3 0-4-2-5-4H11c-1 2-2 4-5 4-2 0-4-2-4-5v-4c0-4 2-6 5-6z" fill="#8a8a8a" stroke="#000" shape-rendering="auto"/><rect x="7" y="16" width="7" height="2" fill="#000"/><rect x="9.5" y="13.5" width="2" height="7" fill="#000"/><circle cx="22" cy="15.5" r="1.6" fill="#e0261d" shape-rendering="auto"/><circle cx="25" cy="18.5" r="1.6" fill="#2fa6d9" shape-rendering="auto"/>`),
            wrestling: SVG(`<rect x="1" y="13" width="30" height="7" fill="#4a3320" stroke="#000"/><ellipse cx="16" cy="16.5" rx="9" ry="8" fill="#f2c230" stroke="#000" shape-rendering="auto"/><ellipse cx="16" cy="16.5" rx="5.5" ry="4.5" fill="#fff3b0" stroke="#b08a10" shape-rendering="auto"/><rect x="3" y="15" width="4" height="3" fill="#f2c230" stroke="#000"/><rect x="25" y="15" width="4" height="3" fill="#f2c230" stroke="#000"/>`),
            life: SVG(`<path d="M16 2v5M16 25v5M2 16h5M25 16h5M6 6l3.5 3.5M22.5 22.5L26 26M26 6l-3.5 3.5M6 26l3.5-3.5" stroke="#e08a3c" stroke-width="2.5" shape-rendering="auto"/><circle cx="16" cy="16" r="7" fill="#ffd83a" stroke="#000" shape-rendering="auto"/>`),
            photos: SVG(`<rect x="3" y="6" width="26" height="20" fill="#fff" stroke="#000"/><rect x="5" y="8" width="22" height="16" fill="#7ec8f0"/><path d="M5 24l7-10 5 6 4-4 6 8z" fill="#2e8b3d"/><circle cx="22" cy="12" r="2.2" fill="#ffd83a" shape-rendering="auto"/>`),
            notepad: SVG(`<path d="M7 3h14l5 5v21H7z" fill="#fff" stroke="#000"/><path d="M21 3v5h5" fill="#c0c0c0" stroke="#000"/><rect x="8" y="4" width="13" height="3" fill="#2f5fd0"/><path d="M10 12h13M10 16h13M10 20h13M10 24h9" stroke="#808080"/>`),
            recycle: SVG(`<path d="M8 9h16l-2 20H10z" fill="#d9e4ec" stroke="#000"/><rect x="6" y="6" width="20" height="3" fill="#b8c6d0" stroke="#000"/><rect x="13" y="4" width="6" height="2" fill="#b8c6d0" stroke="#000"/><path d="M12 12l1 14M16 12v14M20 12l-1 14" stroke="#7a8a96"/><path d="M14 2l5 3-3 2z" fill="#fff" stroke="#000"/>`),
            display: SVG(`<rect x="3" y="4" width="26" height="18" fill="#c0c0c0" stroke="#000"/><rect x="6" y="7" width="20" height="12" fill="#2b64c8"/><ellipse cx="12" cy="11" rx="4" ry="1.6" fill="#fff" shape-rendering="auto"/><ellipse cx="20" cy="15" rx="4" ry="1.6" fill="#fff" shape-rendering="auto"/><rect x="12" y="22" width="8" height="3" fill="#808080"/><rect x="8" y="25" width="16" height="3" fill="#c0c0c0" stroke="#000"/>`),
            power: SVG(`<rect x="4" y="4" width="24" height="24" fill="#c0c0c0" stroke="#000"/><path d="M11 11a8 8 0 1 0 10 0" fill="none" stroke="#e0261d" stroke-width="2.5" shape-rendering="auto"/><rect x="15" y="7" width="2.5" height="9" fill="#e0261d"/>`),
            warning: SVG(`<path d="M16 3L30 28H2z" fill="#ffd83a" stroke="#000" shape-rendering="auto"/><rect x="14.5" y="11" width="3" height="9" fill="#000"/><rect x="14.5" y="22" width="3" height="3" fill="#000"/>`),
            error: SVG(`<circle cx="16" cy="16" r="13" fill="#e0261d" stroke="#000" shape-rendering="auto"/><path d="M11 11l10 10M21 11L11 21" stroke="#fff" stroke-width="3" shape-rendering="auto"/>`),
            paw: SVG(`<ellipse cx="16" cy="21" rx="7" ry="6" fill="#e08a3c" stroke="#000" shape-rendering="auto"/><circle cx="8" cy="13" r="3" fill="#e08a3c" stroke="#000" shape-rendering="auto"/><circle cx="13" cy="8" r="3" fill="#e08a3c" stroke="#000" shape-rendering="auto"/><circle cx="19" cy="8" r="3" fill="#e08a3c" stroke="#000" shape-rendering="auto"/><circle cx="24" cy="13" r="3" fill="#e08a3c" stroke="#000" shape-rendering="auto"/>`)
        };

        const WC = {
            min: '<svg width="8" height="7"><rect x="1" y="5" width="6" height="2"/></svg>',
            max: '<svg width="9" height="9"><path d="M0 0h9v9H0zM1 2v6h7V2z" fill-rule="evenodd"/></svg>',
            close: '<svg width="8" height="7"><path d="M0 0h2l2 2 2-2h2L5 3.5 8 7H6L4 5 2 7H0l3-3.5z"/></svg>'
        };

        // ================================================================
        // Helpers & data
        // ================================================================
        const $ = s => document.querySelector(s);
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const isPhone = () => matchMedia('(max-width: 700px)').matches;
        const reducedMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
        const store = {
            get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
            set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
        };

        function stars(text) {
            if (!text || !/[⭐¾½¼]/.test(text)) return null;
            const full = (text.match(/⭐/g) || []).length;
            const frac = text.includes('¾') ? 0.75 : text.includes('½') ? 0.5 : text.includes('¼') ? 0.25 : 0;
            return (text.includes('-') ? -1 : 1) * (full + frac);
        }

        // Shows with no overall rating get the average of their seasons,
        // same rule the old homepage used.
        function movieRating(item) {
            if (item.rating) return stars(item.rating);
            const vals = (item.seasons || []).map(s => stars(s.rating)).filter(v => v !== null && v >= 0);
            return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
        }

        const fmtStars = v => `${Math.round(v * 4) / 4}★`;

        const ABOUT = "Hey, I'm Landon — welcome to my little corner of the internet. This site is basically a running log of the things I'm into: wrestling, a full Marvel rewatch (rated and reviewed one by one), video games, my cat, and just life in general. Poke around — most sections keep growing as I add more.";

        const PHOTOS = [
            ['disney1.jpg', 'Disney'], ['bray.jpg', 'Bray'], ['miley.jpg', 'Miley'], ['zoo1.jpg', 'Zoo'],
            ['dc1.jpg', 'DC'], ['dc2023.jpg', 'DC 2023'], ['disney2.jpg', 'Disney 2'], ['disney2022.jpg', 'Disney 2022'],
            ['ciccu.jpg', 'Ciccu'], ['aj.jpg', 'AJ'], ['riverview.jpg', 'River view'], ['atlutd.jpg', 'Atlanta United'],
            ['sunset.jpg', 'Ocean sunset'], ['titlebelt.jpg', 'Title belt'], ['monument.jpg', 'Washington Monument'],
            ['oaktrees.jpg', 'Oak trees'], ['redshoe.jpg', 'Red shoe']
        ];

        const MARVEL_FOLDERS = {
            watching: 'Up Next', blade: 'Blade Trilogy', xmen: 'X-Men', raimi: "Sony Spider-Man", otherpre: 'Pre-MCU',
            p1: 'Phase One', p2: 'Phase Two', tv: 'Marvel TV', p3: 'Phase Three', sony: 'Sony Universe', p4: 'Phase Four', p5: 'Phase Five'
        };

        const DATA = { marvel: [], movies: [], matches: [], games: { games: [] }, rosie: [] };
        const dataReady = Promise.all(Object.keys(DATA).map(key =>
            fetch(`data/${key}.json`).then(r => r.json()).then(d => { DATA[key] = d; }).catch(() => {})
        ));

        // ================================================================
        // Wallpapers
        // ================================================================
        const WALLPAPERS = [
            { key: 'landon98', label: "Landon's Day 98", css: 'var(--teal)', logo: true },
            { key: 'teal', label: '(None) – Plain Teal', css: 'var(--teal)' },
            { key: 'clouds', label: 'Clouds', css: 'var(--clouds)' },
            ...PHOTOS.map(([file, label]) => ({ key: file, label, css: `#000 url("./assets/images/slider/${file}") center / cover no-repeat` }))
        ];

        const findWallpaper = key => WALLPAPERS.find(w => w.key === key) || WALLPAPERS[0];

        // The preview monitor in Display Properties can't show the logo
        // layer, so the logo wallpaper previews with a tiny sun instead.
        function wallpaperCss(key, preview = false) {
            const w = findWallpaper(key);
            return preview && w.logo
                ? `radial-gradient(circle at 50% 45%, #ffd83a 0 7px, transparent 8px), ${w.css}`
                : w.css;
        }

        function setWallpaper(key, save = true) {
            const w = findWallpaper(key);
            $('#desktop').style.background = w.css;
            $('#desktop').classList.toggle('show-logo', !!w.logo);
            if (save) store.set('wallpaper', w.key);
        }

        // ================================================================
        // Window manager
        // ================================================================
        const open = new Map();
        let zTop = 10;
        let cascade = 0;

        function focusWin(id) {
            open.forEach((w, key) => {
                const on = key === id;
                w.el.classList.toggle('active', on);
                w.btn?.classList.toggle('active', on && !w.el.classList.contains('min'));
            });
            const w = open.get(id);
            if (w) w.el.style.zIndex = ++zTop;
        }

        function topmostId() {
            let best = null, bestZ = -1;
            open.forEach((w, key) => {
                const z = +w.el.style.zIndex;
                if (!w.el.classList.contains('min') && z > bestZ) { best = key; bestZ = z; }
            });
            return best;
        }

        function closeWin(id) {
            const w = open.get(id);
            if (!w) return;
            w.cleanup?.();
            w.el.remove();
            w.btn?.remove();
            open.delete(id);
            const next = topmostId();
            if (next) focusWin(next);
        }

        function minimizeWin(id) {
            const w = open.get(id);
            w.el.classList.add('min');
            w.btn.classList.remove('active');
            const next = topmostId();
            if (next) focusWin(next);
        }

        // Builds the grey window frame. `app` supplies title/size/icon
        // and a render() that fills the body once the JSON data is in.
        function makeWindow(id, app, { taskbar = true } = {}) {
            const el = document.createElement('div');
            el.className = 'win opening';
            el.setAttribute('role', 'dialog');
            el.setAttribute('aria-label', app.title);

            const vw = innerWidth, vh = innerHeight - 32;
            const w = Math.min(app.w || 560, vw - 16);
            const h = Math.min(app.h || 400, vh - 16);
            let x, y;
            if (app.center) {
                x = (vw - w) / 2;
                y = Math.max(8, (vh - h) / 2);
            } else {
                x = 110 + (cascade % 7) * 26;
                y = 20 + (cascade % 7) * 26;
                cascade++;
            }
            x = Math.max(4, Math.min(x, vw - w - 4));
            y = Math.max(4, Math.min(y, vh - h - 4));
            el.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px`;

            el.innerHTML = `
                <div class="win-title">
                    ${app.icon ? ICONS[app.icon].replace('<svg', '<svg class="app-icon"') : ''}
                    <span class="win-title-text">${esc(app.title)}</span>
                    <div class="win-controls">
                        ${taskbar ? `<button class="wc min" aria-label="Minimize">${WC.min}</button><button class="wc max" aria-label="Maximize">${WC.max}</button>` : ''}
                        <button class="wc close" aria-label="Close">${WC.close}</button>
                    </div>
                </div>
                ${app.menu ? `<div class="win-menu">${app.menu.map(m => `<span>${m}</span>`).join('')}</div>` : ''}
                <div class="win-content" style="display:flex;flex-direction:column;flex:1;min-height:0;"><div class="loading">Loading…</div></div>`;
            $('#windows').appendChild(el);
            el.addEventListener('animationend', () => el.classList.remove('opening'), { once: true });

            let btn = null;
            if (taskbar) {
                btn = document.createElement('button');
                btn.className = 'btn task-btn';
                btn.innerHTML = `${app.icon ? ICONS[app.icon] : ''}<span>${esc(app.title)}</span>`;
                btn.title = app.title;
                btn.addEventListener('click', () => {
                    if (el.classList.contains('min')) { el.classList.remove('min'); focusWin(id); }
                    else if (el.classList.contains('active')) minimizeWin(id);
                    else focusWin(id);
                });
                $('#taskButtons').appendChild(btn);
            }

            open.set(id, { el, btn });
            el.addEventListener('pointerdown', () => focusWin(id));
            el.querySelector('.close').addEventListener('click', () => closeWin(id));
            el.querySelector('.min')?.addEventListener('click', () => minimizeWin(id));
            el.querySelector('.max')?.addEventListener('click', () => el.classList.toggle('max'));

            const title = el.querySelector('.win-title');
            if (taskbar) title.addEventListener('dblclick', e => { if (!e.target.closest('.wc')) el.classList.toggle('max'); });
            makeDraggable(el, title);
            focusWin(id);
            return el;
        }

        function makeDraggable(el, handle) {
            handle.addEventListener('pointerdown', e => {
                if (e.button !== 0 || e.target.closest('.wc') || el.classList.contains('max') || isPhone()) return;
                const sx = e.clientX, sy = e.clientY, ox = el.offsetLeft, oy = el.offsetTop;
                handle.setPointerCapture(e.pointerId);
                const move = ev => {
                    const x = Math.max(80 - el.offsetWidth, Math.min(ox + ev.clientX - sx, innerWidth - 80));
                    const y = Math.max(0, Math.min(oy + ev.clientY - sy, innerHeight - 32 - 24));
                    el.style.left = x + 'px';
                    el.style.top = y + 'px';
                };
                const up = () => {
                    handle.removeEventListener('pointermove', move);
                    handle.removeEventListener('pointerup', up);
                    handle.removeEventListener('pointercancel', up);
                };
                handle.addEventListener('pointermove', move);
                handle.addEventListener('pointerup', up);
                handle.addEventListener('pointercancel', up);
            });
        }

        async function openApp(id) {
            const app = APPS[id];
            if (!app) return;
            closeMenus();
            if (open.has(id)) {
                open.get(id).el.classList.remove('min');
                focusWin(id);
                return;
            }
            const el = makeWindow(id, app);
            await dataReady;
            if (!open.has(id)) return; // closed while loading
            el.querySelector('.win-content').innerHTML = app.render();
            const cleanup = app.init?.(el);
            open.get(id).cleanup = cleanup;
        }

        // Little modal message boxes (no taskbar button), e.g. the
        // Recycle Bin gags. buttons: [{ label, action }]
        let msgCount = 0;
        function msgBox(title, icon, text, buttons = [{ label: 'OK' }]) {
            const id = `msg${++msgCount}`;
            const el = makeWindow(id, { title, w: 360, h: 160, center: true }, { taskbar: false });
            el.style.height = 'auto';
            el.querySelector('.win-content').innerHTML = `
                <div class="msg">${ICONS[icon]}<div>${text}</div></div>
                <div class="msg-buttons">${buttons.map((b, i) => `<button class="btn${i === 0 ? ' default' : ''}" data-i="${i}">${esc(b.label)}</button>`).join('')}</div>`;
            el.querySelectorAll('.msg-buttons .btn').forEach(b => b.addEventListener('click', () => {
                closeWin(id);
                buttons[+b.dataset.i].action?.();
            }));
            el.querySelector('.msg-buttons .btn').focus();
        }

        // ================================================================
        // Window contents
        // ================================================================
        function explorer({ path, href, hrefLabel, body, status, sunken = true }) {
            return `
                <div class="win-toolbar">
                    <span class="label">Address</span>
                    <div class="field">${esc(path)}</div>
                    ${href ? `<a class="btn" href="${href}">${esc(hrefLabel)} ▸</a>` : ''}
                </div>
                <div class="win-body${sunken ? ' sunken' : ''}">${body}</div>
                <div class="win-status">${status.map(s => `<span>${s}</span>`).join('')}</div>`;
        }

        function posterGrid(items, folder, href) {
            return `<div class="file-grid">${items.map(i => `
                <a class="file" href="${href}">
                    <img src="./assets/images/${folder}/${esc(i.poster)}" alt="" loading="lazy">
                    <span class="name">${esc(i.title)}</span>
                    <span class="meta">${fmtStars(i._v)}</span>
                </a>`).join('')}</div>`;
        }

        function topRated(list, rate, n = 12) {
            return list.map((d, i) => ({ ...d, _v: rate(d), _i: i }))
                .filter(d => d._v !== null && d._v >= 0)
                .sort((a, b) => b._v - a._v || a._i - b._i)
                .slice(0, n);
        }

        const notepad = text => `<div class="win-body sunken" style="padding:0"><textarea class="notepad" readonly>${esc(text)}</textarea></div>`;

        // Shared by the Rosie viewer and My Photos: prev/next through a

        // ================================================================
        // Rosie, the desktop pet: a pixel calico who wanders the bottom
        // of the screen, sits down now and then, and talks when clicked.
        // ================================================================
        const CAT_COLORS = { W: '#fbf8f2', O: '#e08a3c', K: '#2a2522', E: '#111', P: '#e9a0a0' };
        const CAT_BODY = [
            'O..........O..K.',
            'O.........OO.KK.',
            'O.........OOWKKK',
            'OO........OEWWEK',
            '.OWWWOOOKKWWWPWW',
            '.WWWOOOOKKWWWWW.',
            '.WWWWOOKKKWWWW..',
            '.WWWWWWWWWWWWW..',
            '.WWWWWWWWWWWWW..'
        ];
        const LEGS_A = ['.WW.WW....WW.WW.', '.WW.WW....WW.WW.'];
        const LEGS_B = ['..WWW......WWW..', '..WWW......WWW..'];

        function catSvg(rows, cls) {
            let rects = '';
            rows.forEach((row, y) => [...row].forEach((c, x) => {
                if (CAT_COLORS[c]) rects += `<rect x="${x}" y="${y}" width="1" height="1" fill="${CAT_COLORS[c]}"/>`;
            }));
            return `<svg class="${cls}" viewBox="0 0 16 11" width="64" height="44" shape-rendering="crispEdges">${rects}</svg>`;
        }

        const PET_LINES = [
            'mrrp.',
            'this is MY desktop.',
            'feed me. it has been 4 minutes.',
            'have you seen my Scratchboard? <a href="rosie">go look</a>',
            'i knocked something off your desk. no regrets.',
            'the Recycle Bin smells like Morbius.',
            '*loafs aggressively*'
        ];

        // Three moods:
        //   wander — strolls along the taskbar, sits down now and then
        //   chase  — Oneko-style: runs after the mouse cursor (or to a tapped
        //            spot on touch screens), stopping just short of it
        //   return — after 10s with no input, walks back down to the taskbar
        function startPet() {
            const desk = $('#desktop');
            const pet = $('#pet');
            const bubble = $('#petBubble');
            pet.innerHTML = catSvg([...CAT_BODY, ...LEGS_A], 'frame-a') + catSvg([...CAT_BODY, ...LEGS_B], 'frame-b');

            const W = 64, H = 44;
            const WALK = 34, RUN = 240, HOME = 90;   // px per second
            const NEAR = 44, FAR = 56;               // stop / start-chasing distance from the cursor
            const IDLE_MS = 10000;
            const still = reducedMotion();
            const ground = () => desk.clientHeight - H - 2;

            let x = Math.min(innerWidth * 0.55, innerWidth - 80), y = ground();
            let dir = 1, mode = 'wander', sitUntil = 0, lastInput = 0, lastStep = 0, last = performance.now();
            let tx = 0, ty = 0, bubbleTimer;

            const say = () => {
                bubble.innerHTML = PET_LINES[Math.floor(Math.random() * PET_LINES.length)];
                bubble.hidden = false;
                clearTimeout(bubbleTimer);
                bubbleTimer = setTimeout(() => { bubble.hidden = true; }, 4500);
                sitUntil = performance.now() + 4500;
            };
            pet.addEventListener('click', say);
            pet.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); say(); } });

            const chase = (cx, cy) => {
                if (still) return;
                const r = desk.getBoundingClientRect();
                tx = cx - r.left;
                ty = Math.min(cy - r.top, ground() + H / 2); // cursor on the taskbar = run along the bottom
                mode = 'chase';
                lastInput = performance.now();
            };
            document.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') chase(e.clientX, e.clientY); });
            desk.addEventListener('pointerdown', e => {
                if (e.pointerType === 'mouse') return;
                if (e.target.closest('.icon, .win, .widget, .sticky, .pet, .pet-bubble')) return;
                chase(e.clientX, e.clientY);
            });

            // Steps toward (px, py); returns true once there.
            function moveToward(px, py, speed, dt) {
                const dx = px - x, dy = py - y, d = Math.hypot(dx, dy);
                if (d < 1) { x = px; y = py; return true; }
                const step = Math.min(d, speed * dt);
                x += dx / d * step;
                y += dy / d * step;
                if (Math.abs(dx) > 2) dir = dx > 0 ? 1 : -1;
                return false;
            }

            function frame(now) {
                const dt = Math.min((now - last) / 1000, 0.1);
                last = now;
                let walking = false, stepMs = 180;

                if (mode === 'chase' && now - lastInput > IDLE_MS) mode = 'return';

                if (mode === 'chase') {
                    const cx = x + W / 2, cy = y + H / 2;
                    const d = Math.hypot(tx - cx, ty - cy);
                    if (d > FAR) {
                        // aim for the point NEAR px short of the cursor
                        const k = (d - NEAR) / d;
                        moveToward(x + (tx - cx) * k, y + (ty - cy) * k, RUN, dt);
                        walking = true;
                        stepMs = 90;
                    }
                } else if (mode === 'return') {
                    walking = !moveToward(x, ground(), HOME, dt);
                    if (!walking) mode = 'wander';
                } else if (!still) {
                    y = ground();
                    if (now > sitUntil) {
                        x += dir * WALK * dt;
                        walking = true;
                        if (x < 4) { x = 4; dir = 1; }
                        if (x > innerWidth - W - 6) { x = innerWidth - W - 6; dir = -1; }
                        if (Math.random() < 0.0025) sitUntil = now + 2000 + Math.random() * 3000;
                    }
                }

                x = Math.max(0, Math.min(x, innerWidth - W));
                y = Math.max(0, Math.min(y, ground()));

                if (walking && now - lastStep > stepMs) { pet.classList.toggle('step'); lastStep = now; }
                if (!walking) pet.classList.add('step'); // legs-together frame = sitting

                pet.style.transform = `translate(${x}px, ${y}px)`;
                pet.classList.toggle('flip', dir < 0);
                const bx = Math.max(4, Math.min(x - 10, innerWidth - 200));
                const by = Math.max(4, y - bubble.offsetHeight - 10);
                bubble.style.transform = `translate(${bx}px, ${by}px)`;
                requestAnimationFrame(frame);
            }
            requestAnimationFrame(frame);
        }

        // ================================================================
        // Desktop widgets: sticky note, Now Playing, Rosie's photo frame,
        // What's New. All built from the same JSON the pages use, so they
        // stay current without any extra editing.
        // ================================================================
        function lastWatched(review) {
            const m = /Last Watched:\s*([A-Za-z]+ \d+)(?:st|nd|rd|th)?,?\s*(\d{4})/.exec(review || '');
            if (!m) return null;
            const d = new Date(`${m[1]}, ${m[2]}`);
            return isNaN(d) ? null : d;
        }

        function ago(date) {
            const days = Math.floor((Date.now() - date) / 86400000);
            if (days < 1) return 'today';
            if (days === 1) return 'yesterday';
            if (days < 30) return `${days} days ago`;
            const months = Math.floor(days / 30.4);
            if (months < 12) return months === 1 ? 'a month ago' : `${months} months ago`;
            const years = Math.floor(months / 12);
            return years === 1 ? 'a year ago' : `${years} years ago`;
        }

        const clip = (s, n) => (s.length > n ? s.slice(0, n - 1).trimEnd() + '…' : s);

        function latestReview(list, rate) {
            return list.map(i => ({ ...i, _d: lastWatched(i.review) }))
                .filter(i => i._d)
                .sort((a, b) => b._d - a._d)[0];
        }

        function renderWidgets() {
            const wrap = $('#widgets');
            const html = [];

            // Sticky note — the first "Up Next" Marvel title is the to-do.
            const next = DATA.marvel.find(m => m.category === 'watching');
            html.push(`
                <div class="sticky" aria-label="Sticky note">
                    <b>TO DO:</b>
                    ☐ watch ${esc(next ? next.title : 'more Marvel')}<br>
                    ☐ feed rosie (again)<br>
                    <span class="done">☑ make a website</span><br>
                    ☐ touch grass
                </div>`);

            // Now Playing — most recently played Steam game.
            const game = DATA.games.games.slice().sort((a, b) => (b.last_played_ts || 0) - (a.last_played_ts || 0))[0];
            if (game) {
                html.push(`
                    <div class="widget np" data-open="games" title="Open Games">
                        <div class="widget-title">${ICONS.games} Now Playing</div>
                        <div class="lcd">
                            <span class="lcd-scroll">*** ${esc(game.name.toUpperCase())} *** ${game.hours.toLocaleString()} HRS PLAYED ***</span>
                            <div class="lcd-row"><span>LAST: ${esc(game.last_played || '')}</span><span>${game.pct}%</span></div>
                        </div>
                        <img class="np-art" src="${esc(game.header_image)}" alt="">
                        <div class="np-bar" title="${game.pct}% of all Steam time"><span style="width:${Math.min(100, game.pct)}%"></span></div>
                        <div class="np-controls"><span class="btn">⏮</span><span class="btn">▶</span><span class="btn">⏸</span><span class="btn">⏭</span></div>
                    </div>`);
            }

            // Rosie's photo frame — cycles her latest posts.
            const posts = DATA.rosie.slice().sort((a, b) => b.date.localeCompare(a.date)).slice(0, 8);
            if (posts.length) {
                html.push(`
                    <div class="widget" data-open="rosie" title="Open Rosie">
                        <div class="widget-title">${ICONS.rosie} rosie_cam.exe</div>
                        <div class="frame-photo">${posts.map((p, i) =>
                            `<img src="./assets/images/rosie/${esc(p.image)}" alt="" loading="lazy"${i === 0 ? ' class="on"' : ''}>`).join('')}</div>
                        <div class="frame-caption" id="frameCaption">${esc(posts[0].caption)}</div>
                    </div>`);
            }

            // What's New — newest thing from each section, newest first.
            const news = [];
            const post = posts[0];
            if (post) news.push({ d: new Date(post.date), icon: 'rosie', open: 'rosie', text: `Rosie posted: “${clip(post.caption, 40)}”` });
            const mv = latestReview(DATA.marvel);
            if (mv) news.push({ d: mv._d, icon: 'marvel', open: 'marvel', text: `Reviewed ${mv.title}${stars(mv.rating) !== null ? ` · ${fmtStars(Math.abs(stars(mv.rating)))}` : ''}` });
            const mo = latestReview(DATA.movies);
            if (mo) news.push({ d: mo._d, icon: 'movies', open: 'movies', text: `Watched ${mo.title}` });
            if (game && game.last_played_ts) news.push({ d: new Date(game.last_played_ts * 1000), icon: 'games', open: 'games', text: `Played ${game.name}` });
            news.sort((a, b) => b.d - a.d);
            if (news.length) {
                html.push(`
                    <div class="widget whats-new">
                        <div class="widget-title">${ICONS.life} What's New</div>
                        <div class="news">${news.map(n => `
                            <div class="news-item" data-open="${n.open}">${ICONS[n.icon]}<div>${esc(n.text)}<small>${ago(n.d)}</small></div></div>`).join('')}
                        </div>
                    </div>`);
            }

            wrap.innerHTML = html.join('');

            // Cross-fade the photo frame every 5 seconds: the next photo
            // fades in on top, and the old one is dropped once covered,
            // so the frame never dips to black in between.
            const imgs = wrap.querySelectorAll('.frame-photo img');
            if (imgs.length > 1 && !reducedMotion()) {
                let i = 0, z = 1;
                setInterval(() => {
                    const prev = imgs[i];
                    i = (i + 1) % imgs.length;
                    imgs[i].style.zIndex = ++z;
                    imgs[i].classList.add('on');
                    setTimeout(() => prev.classList.remove('on'), 900);
                    $('#frameCaption').textContent = posts[i].caption;
                }, 5000);
            }
        }

        // ================================================================
        // Go
        // ================================================================
        setWallpaper(store.get('wallpaper') || 'landon98', false);
        $('#desktopLogo').insertAdjacentHTML('afterbegin', ICONS.life);
        renderIcons();
        dataReady.then(renderWidgets);
        startPet();
        boot(() => {
            if (store.get('hideWelcome') !== '1') openApp('welcome');
        });
    </script>
</body>
</html>
