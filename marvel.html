<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marvel — Landon's Day</title>
    <link rel="stylesheet" href="./assets/css/styles.css">
    <link rel="stylesheet" href="./assets/css/marvel.css">
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Marvel — Landon's Day">
    <meta property="og:description" content="Every MCU movie and show, rated and reviewed one by one, from Blade to Phase Five.">
    <meta property="og:url" content="https://www.landonday.com/marvel">
    <meta property="og:image" content="https://www.landonday.com/assets/images/marvel.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Marvel — Landon's Day">
    <meta name="twitter:description" content="Every MCU movie and show, rated and reviewed one by one, from Blade to Phase Five.">
    <meta name="twitter:image" content="https://www.landonday.com/assets/images/marvel.jpg">
</head>
<body>

    <nav class="site-nav">
        <a class="site-nav-logo" href="index">Landon's Day</a>
        <div class="site-nav-links">
            <a class="site-nav-link active" href="marvel">Marvel</a>
            <a class="site-nav-link" href="movies">Movies</a>
            <a class="site-nav-link" href="rosie">Rosie</a>
            <a class="site-nav-link" href="games">Games</a>
            <a class="site-nav-link" href="life">Life</a>
            <a class="site-nav-link" href="wrestling">Wrestling</a>
        </div>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode">DARK MODE</button>
    </nav>

    <main class="comic-page">
        <section class="cover">
            <div class="cover-masthead">
                <div class="cover-corner">
                    <span class="price">25¢</span>
                    <span class="issue" id="coverIssue">NO. 1</span>
                </div>
                <h1 class="cover-title">Landon's Marvel<small id="coverTagline">Every movie &amp; show, rated one by one</small></h1>
            </div>
            <div class="cover-art">
                <video src="./assets/images/marvel-intro.mp4" autoplay muted loop playsinline></video>
                <div class="cover-blurb" id="coverBlurb"></div>
                <div class="cover-seal">Approved<br>by<br>Rosie</div>
                <div class="cover-caption">
                    <div class="narration" id="coverNarration">From Blade to Phase Five, one fan watches it all… and has opinions.</div>
                </div>
            </div>
            <div class="cover-stats">
                <div class="cover-stat"><b id="statReviewed">0</b><span>Reviewed</span></div>
                <div class="cover-stat"><b id="statFive">0</b><span>Perfect 5s</span></div>
                <div class="cover-stat"><b id="statNext">0</b><span>Up Next</span></div>
            </div>
        </section>

        <div id="issues"></div>
    </main>

    <button class="random-block" id="randomIssue" type="button" aria-label="Open a random review" title="Random issue!">?</button>

    <div class="modal-overlay" id="reviewModal">
        <div class="modal-box">
            <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
            <div class="modal-side">
                <div class="modal-poster-thumb">
                    <img id="modalPosterImg" src="" alt=""
                         onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div class="modal-poster-thumb-fallback">🎬</div>
                </div>
                <div>
                    <div class="modal-rating" id="modalRating"></div>
                    <div class="modal-season-label" id="modalSeasonLabel" style="display:none;">Season Overall</div>
                </div>
            </div>
            <div class="modal-main">
                <h2 class="modal-title" id="modalTitle"></h2>
                <div class="modal-meta" id="modalMeta"></div>
                <div class="modal-episodes" id="modalEpisodes" style="display:none;"></div>
                <div class="modal-review" id="modalReview"></div>
                <div class="narration modal-last-watched" id="modalLastWatched" style="display:none;"></div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Landon's Day. All rights reserved.</p>
    </footer>

    <script>
        // "Up Next" moves to the end as a "Next Issue" teaser, like the
        // last page of a real comic.
        const ISSUES = [
            { key: "blade", label: "Blade Trilogy", narration: "Before the shared universe, there was a Daywalker…" },
            { key: "xmen", label: "X-Men Universe", narration: "Meanwhile, at a school for gifted youngsters…" },
            { key: "raimi", label: "Sony's Spider-Man", narration: "With great power comes great responsibility…" },
            { key: "otherpre", label: "Other Pre-MCU Films", narration: "The weird years. We don't talk about some of these." },
            { key: "p1", label: "Phase One", narration: "It all began in a cave, with a box of scraps…" },
            { key: "p2", label: "Phase Two", narration: "The Avengers assembled. Now what?" },
            { key: "tv", label: "Marvel Television", narration: "Elsewhere, on the small screen…" },
            { key: "p3", label: "Phase Three", narration: "Half of all life hangs in the balance…" },
            { key: "sony", label: "Sony's Spider-Man Universe", narration: "In a universe with, somehow, no Spider-Man…" },
            { key: "p4", label: "Phase Four", narration: "After the snap, the multiverse cracks wide open…" },
            { key: "p5", label: "Phase Five", narration: "And the story continues…" },
            { key: "watching", label: "Next Issue", narration: "Coming soon to a couch near you!", next: true }
        ];

        // Sound effects matched to the hero in the title (first match wins,
        // arrays cycle so repeat heroes don't all say the same thing).
        // Anything unmatched falls back to the generic list.
        const HERO_SFX = [
            [/spider/i, ["THWIP!", "THWIP-THWIP!", "WHAP!"]],
            [/daredevil/i, ["KRAK!", "WHAP!"]],
            [/logan|wolverine/i, ["SNIKT!"]],
            [/infinity war|endgame/i, ["*SNAP*"]],
            [/captain america/i, ["KLANG!"]],
            [/guardians/i, ["I AM GROOT!"]],
            [/thor/i, ["KRAKOOM!"]],
            [/hulk/i, ["SMASH!"]],
            [/iron man/i, ["FWOOSH!"]],
            [/x2|nightcrawler/i, ["BAMF!"]],
            [/blade/i, ["SHINK!"]],
            [/deadpool/i, ["CHIMICHANGA!"]]
        ];
        const GENERIC_SFX = ["POW!", "BAM!", "WHAM!", "BOOM!", "ZAP!"];
        const sfxUses = new Map();

        function sfxFor(title) {
            const hit = HERO_SFX.find(([re]) => re.test(title));
            const list = hit ? hit[1] : GENERIC_SFX;
            const n = sfxUses.get(list) || 0;
            sfxUses.set(list, n + 1);
            return list[n % list.length];
        }

        // Hover stamps for the flops (2★ and under), cycled in order.
        const FLOP_STAMPS = ["DEFEATED!", "CANCELLED!", "OOF.", "RETCONNED!", "NOPE!"];
        let flopNo = 0;

        // The cover rolls a new headline each visit, like a new issue.
        // {n} = titles reviewed, {five} = perfect 5s.
        const COVER_BLURBS = ["THE SNAP!", "WHO IS THE BEST AVENGER?!", "NOW WITH {n} REVIEWS!", "{five} PERFECT 5s INSIDE!", "SPOILERS AHEAD!", "NOT ALL HEROES GET 5 STARS!"];
        const COVER_TAGLINES = ["Every movie & show, rated one by one", "The multiverse, reviewed", "Earth's mightiest opinions", "Collector's edition!"];
        const COVER_NARRATIONS = [
            "From Blade to Phase Five, one fan watches it all… and has opinions.",
            "One man. Every Marvel movie. No skipping the bad ones.",
            "In this issue: triumphs, tragedies, and at least one Morbius.",
            "Reviews so honest, Nick Fury classified them."
        ];

        function pick(list) {
            return list[Math.floor(Math.random() * list.length)];
        }

        // Every panel that has a real review, for the "?" random button.
        const reviewedPanels = [];

        function ratingValue(text) {
            if (!text || text.includes('-')) return null;
            const full = (text.match(/⭐/g) || []).length;
            const frac = text.includes('¾') ? 0.75 : text.includes('½') ? 0.5 : text.includes('¼') ? 0.25 : 0;
            return full + frac;
        }

        function esc(s) {
            return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        }

        async function loadMarvel() {
            const data = await (await fetch('data/marvel.json')).json();
            const container = document.getElementById('issues');

            const rated = data.filter(i => ratingValue(i.rating) !== null);
            document.getElementById('statReviewed').textContent = rated.length;
            document.getElementById('statFive').textContent = rated.filter(i => ratingValue(i.rating) === 5).length;
            document.getElementById('statNext').textContent = data.filter(i => i.category === 'watching').length;
            document.getElementById('coverIssue').textContent = `NO. ${rated.length}`;

            const fiveCount = rated.filter(i => ratingValue(i.rating) === 5).length;
            document.getElementById('coverBlurb').textContent =
                pick(COVER_BLURBS).replace('{n}', rated.length).replace('{five}', fiveCount);
            document.getElementById('coverTagline').textContent = pick(COVER_TAGLINES);
            document.getElementById('coverNarration').textContent = pick(COVER_NARRATIONS);

            let issueNo = 0;
            ISSUES.forEach(cat => {
                const items = data.filter(i => i.category === cat.key);
                if (!items.length) return;

                const years = items.map(i => i.year).filter(Boolean);
                const lo = Math.min(...years), hi = Math.max(...years);
                const yearText = lo === hi ? String(lo) : `${lo}–${hi}`;

                const section = document.createElement('section');
                section.className = 'issue' + (cat.next ? ' next-issue' : '');
                section.innerHTML = `
                    <div class="issue-header">
                        <span class="issue-number">${cat.next ? 'COMING SOON' : `ISSUE #${++issueNo}`}</span>
                        <h2 class="issue-title">${esc(cat.label)}</h2>
                        <span class="issue-years">${yearText}</span>
                    </div>
                    <div class="narration">${esc(cat.narration)}</div>
                    <div class="comic-grid"></div>`;
                const grid = section.querySelector('.comic-grid');

                items.forEach(item => {
                    const v = ratingValue(item.rating);
                    const splash = v === 5;
                    const panel = document.createElement('div');
                    panel.className = 'panel' + (splash ? ' splash' : '');
                    panel.tabIndex = 0;
                    panel.setAttribute('role', 'button');
                    panel.setAttribute('aria-label', item.title);
                    panel.innerHTML = `
                        <img src="./assets/images/marvel/${esc(item.poster)}" alt="" loading="lazy"
                             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                        <div class="panel-fallback">${esc(item.title)}</div>
                        ${v !== null ? `<div class="panel-rating${v <= 2 ? ' low' : ''}">${v}★</div>` : ''}
                        ${splash ? `<div class="sfx">${sfxFor(item.title)}</div>` : ''}
                        ${v !== null && v <= 2 ? `<div class="flop-stamp">${FLOP_STAMPS[flopNo++ % FLOP_STAMPS.length]}</div>` : ''}
                        <div class="panel-title">${esc(item.title)}</div>`;
                    panel.addEventListener('click', () => openModal(item, panel));
                    panel.addEventListener('keydown', e => {
                        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModal(item, panel); }
                    });
                    grid.appendChild(panel);
                    if (item.review) reviewedPanels.push({ item, panel });
                });

                container.appendChild(section);
            });

            printPanelsOnScroll();
        }

        // Panels "print" onto the page as they scroll into view. Panels
        // that arrive in the same batch get staggered so they stamp in
        // one after another. Skipped entirely for reduced-motion users.
        function printPanelsOnScroll() {
            if (!('IntersectionObserver' in window)) return;
            if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;

            document.body.classList.add('animate-panels');
            const observer = new IntersectionObserver(entries => {
                let order = 0;
                entries.forEach(entry => {
                    if (!entry.isIntersecting) return;
                    entry.target.style.setProperty('--delay', `${Math.min(order++, 12) * 60}ms`);
                    entry.target.classList.add('printed');
                    observer.unobserve(entry.target);
                });
            }, { threshold: 0.15 });

            document.querySelectorAll('.panel').forEach(p => observer.observe(p));
        }

        function renderStars(text) {
            const v = ratingValue(text);
            if (v === null) return text || '';
            const used = Math.ceil(v);
            return text + `<span class="modal-rating-empty">${'☆'.repeat(Math.max(0, 5 - used))}</span>`;
        }

        function openModal(item, sourcePanel) {
            document.getElementById('modalTitle').textContent = item.title;
            document.getElementById('modalMeta').textContent = `${item.year} • ${item.type}`;

            const img = document.getElementById('modalPosterImg');
            img.style.display = 'block';
            img.nextElementSibling.style.display = 'none';
            img.src = `./assets/images/marvel/${item.poster}`;
            img.alt = item.title;

            const eps = document.getElementById('modalEpisodes');
            const hasEps = item.episodes && item.episodes.length > 0;
            eps.innerHTML = hasEps ? item.episodes.map(ep =>
                `<div class="modal-episode-row"><span class="ep-name">${esc(ep.title)}</span><span class="ep-rating">${ep.rating || ''}</span></div>`
            ).join('') : '';
            eps.style.display = hasEps ? 'block' : 'none';
            document.getElementById('modalSeasonLabel').style.display = hasEps ? 'block' : 'none';

            document.getElementById('modalRating').innerHTML = item.rating ? renderStars(item.rating) : '';

            const review = document.getElementById('modalReview');
            const last = document.getElementById('modalLastWatched');
            last.style.display = 'none';
            review.classList.remove('pending');
            if (item.review) {
                const m = item.review.match(/^([\s\S]*?)\n\n(Last Watched:.+)$/);
                review.textContent = m ? m[1] : item.review;
                if (m) { last.textContent = m[2]; last.style.display = 'inline-block'; }
            } else {
                review.textContent = "Review coming soon!";
                review.classList.add('pending');
            }

            document.getElementById('reviewModal').classList.add('open');
            popFrom(sourcePanel);
        }

        // Balloon-pop: the modal grows out of the poster that was
        // clicked (its transform-origin is aimed at that panel's
        // center), then the speech bubble inflates a beat later.
        function popFrom(panel) {
            const box = document.querySelector('.modal-box');
            box.classList.remove('popping');
            if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;

            const p = panel && panel.getBoundingClientRect();
            const onScreen = p && p.bottom > 0 && p.top < innerHeight;
            if (onScreen) {
                const b = box.getBoundingClientRect();
                box.style.transformOrigin =
                    `${p.left + p.width / 2 - b.left}px ${p.top + p.height / 2 - b.top}px`;
            } else {
                box.style.transformOrigin = 'center';
            }
            void box.offsetWidth; // restart the animation on every open
            box.classList.add('popping');
        }

        // "?" block: bump, scroll to a random reviewed title, flash it,
        // then open its review.
        document.getElementById('randomIssue').addEventListener('click', e => {
            if (!reviewedPanels.length) return;
            const btn = e.currentTarget;
            btn.classList.remove('bump');
            void btn.offsetWidth;
            btn.classList.add('bump');

            const { item, panel } = pick(reviewedPanels);
            closeModal();
            panel.scrollIntoView({ behavior: 'smooth', block: 'center' });
            panel.classList.remove('picked');
            void panel.offsetWidth;
            panel.classList.add('picked');
            setTimeout(() => openModal(item, panel), 900);
        });

        function closeModal() {
            document.getElementById('reviewModal').classList.remove('open');
        }

        document.getElementById('modalClose').addEventListener('click', closeModal);
        document.getElementById('reviewModal').addEventListener('click', e => {
            if (e.target.id === 'reviewModal') closeModal();
        });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

        (function () {
            const btn = document.getElementById('themeToggle');
            const KEY = 'marvelDarkMode';
            function apply(dark) {
                document.body.classList.toggle('dark-mode', dark);
                btn.textContent = dark ? 'LIGHT MODE' : 'DARK MODE';
            }
            let saved = false;
            try { saved = localStorage.getItem(KEY) === 'true'; } catch (e) {}
            apply(saved);
            btn.addEventListener('click', () => {
                const dark = !document.body.classList.contains('dark-mode');
                apply(dark);
                try { localStorage.setItem(KEY, dark); } catch (e) {}
            });
        })();

        loadMarvel();
    </script>
</body>
</html>
