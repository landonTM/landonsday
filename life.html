<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life — Landon's Day</title>
    <link rel="stylesheet" href="./assets/css/styles.css">
    <link rel="stylesheet" href="./assets/css/life.css">
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Life — Landon's Day">
    <meta property="og:description" content="A travel journal: places I've been, and what's on my mind.">
    <meta property="og:url" content="https://www.landonday.com/life">
    <meta property="og:image" content="https://www.landonday.com/assets/images/life.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Life — Landon's Day">
    <meta name="twitter:description" content="A travel journal: places I've been, and what's on my mind.">
    <meta name="twitter:image" content="https://www.landonday.com/assets/images/life.png">
</head>
<body class="life-page">

    <nav class="site-nav">
        <a class="site-nav-logo" href="index">Landon's Day</a>
        <div class="site-nav-links">
            <a class="site-nav-link" href="marvel">Marvel</a>
            <a class="site-nav-link" href="movies">Movies</a>
            <a class="site-nav-link" href="rosie">Rosie</a>
            <a class="site-nav-link" href="games">Games</a>
            <a class="site-nav-link active" href="life">Life</a>
            <a class="site-nav-link" href="wrestling">Wrestling</a>
        </div>
    </nav>

    <main class="tj">
        <div class="tj-cover">
            <span class="band" aria-hidden="true"></span>
            <h1 class="dymo">FIELD NOTES</h1>
            <p class="tj-sub">Places I’ve been, and what’s on my mind.</p>
            <p class="tj-by">— L.D. · <span id="entryCount"></span></p>
        </div>

        <div class="tj-front">
        <div class="tj-main">
        <section class="tj-index" aria-label="Index of entries">
            <span class="tape" aria-hidden="true"></span>
            <div class="tj-index-head">
                <h2>Index</h2>
                <div class="tj-filter" role="group" aria-label="Show">
                    <button data-f="all" aria-pressed="true">All</button>
                    <button data-f="trip" aria-pressed="false">Trips</button>
                    <button data-f="thought" aria-pressed="false">Thoughts</button>
                </div>
            </div>
            <ol id="index"></ol>
        </section>

        <section class="tj-now" aria-labelledby="nowTitle" hidden>
            <span class="pin" aria-hidden="true"></span>
            <h2 class="tj-now-title" id="nowTitle">Currently</h2>
            <dl id="now"></dl>
        </section>
        </div>

        <div class="tj-side">
        <section class="tj-bucket" aria-labelledby="bucketTitle" hidden>
            <span class="tape" aria-hidden="true"></span>
            <h2 class="tj-bucket-title" id="bucketTitle">Bucket list</h2>
            <ul id="bucket"></ul>
            <p class="tj-bucket-count" id="bucketCount"></p>
        </section>
        </div>
        </div>

        <div id="entries"><p class="tj-empty">Opening the journal…</p></div>
    </main>

    <dialog class="tj-lightbox" id="lightbox" aria-label="Photo">
        <figure>
            <img id="lbImg" alt="">
            <figcaption id="lbCap"></figcaption>
        </figure>
        <button class="lb-close" id="lbClose" aria-label="Close">✕</button>
    </dialog>

    <footer>
        <p>&copy; 2026 Landon's Day. All rights reserved.</p>
    </footer>

    <script src="./assets/js/life.js"></script>
</body>
</html>
